<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hypium | Yönetici Girişi</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #123047;
      background:
        radial-gradient(circle at top right, #dcecf7, transparent 40%),
        #f3f6fa;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: white;
      border: 1px solid #e1e8ef;
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(0, 40, 65, .10);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand img {
      width: 84px;
      height: 84px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 14px 0 8px;
      font-size: 26px;
      color: #00304d;
    }

    .brand p {
      margin: 0;
      color: #718096;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccd7e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #00618b;
      box-shadow: 0 0 0 3px rgba(0, 97, 139, .12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #003b5c;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #00547a; }

    #message {
      min-height: 20px;
      margin: 14px 0 0;
      color: #b42318;
      font-size: 14px;
      text-align: center;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      color: #526779;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="login-card">
    <header class="brand">
      <img src="../assets/logo.png" alt="Hypium FRC Team logosu">
      <h1>Yönetim Paneli</h1>
      <p>Hypium FRC Team #11920</p>
    </header>

    <form id="loginForm">
      <label for="username">Kullanıcı adı</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Şifre</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Giriş yap</button>
      <p id="message" role="alert"></p>
    </form>

    <a class="back" href="../index.html">← Ana siteye dön</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Kontrol ediliyor...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Giriş başarısız.");
        }

        window.location.href = "/admin/";
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Sunucuya ulaşılamadı. Lütfen tekrar deneyin."
            : error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Giriş yap";
      }
    });
  </script>
</body>
</html>
